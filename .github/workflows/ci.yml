name: Social Hub CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Check Worker syntax
        run: npm run check:syntax
      - name: Run unit tests
        run: npm test
