function listForecastSeries(rs){const by={};rs.forEach(r=>{const k=r.platform+'|||'+r.metric;(by[k]||(by[k]={platform:r.platform,metric:r.metric,map:{}})).map[r.date]=Number(r.value)});return Object.values(by).filter(s=>{const dates=Object.keys(s.map).sort();if(dates.length<28)return false;const tail=dates.slice(-28);for(let i=1;i<tail.length;i++){const a=new Date(tail[i-1]+'T00:00:00Z').getTime(),b=new Date(tail[i]+'T00:00:00Z').getTime();if(b-a!==86400000)return false}return true})}
function forecastSeries(s){const dates=Object.keys(s.map).sort().slice(-28);const ys=dates.map(d=>Number(s.map[d]));const xs=ys.map((v,i)=>i);const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;let den=0,numr=0;xs.forEach((x,i)=>{den+=(x-mx)*(x-mx);numr+=(x-mx)*(ys[i]-my)});const slope=den?numr/den:0,intercept=my-slope*mx;const next=[];for(let i=0;i<7;i++)next.push(Math.max(0,intercept+slope*(27+i+1)));const avg=next.reduce((a,b)=>a+b,0)/next.length;const recent=ys.slice(-7).reduce((a,b)=>a+b,0)/7;const change=recent===0?null:((next.reduce((a,b)=>a+b,0)/7/recent)-1)*100;return {next,avg,change,baseDate:dates[dates.length-1],count:28,method:'Linear trend fitted to the latest 28 consecutive daily observations; 7-day point estimate.'}}
function listGrowthComparisons(rs){
const by={};
rs.forEach(r=>{const k=r.platform+'|||'+r.metric;(by[k]||(by[k]={platform:r.platform,metric:r.metric,map:{}})).map[r.date]=Number(r.value)});
const out=[];
Object.values(by).forEach(s=>{
const dates=Object.keys(s.map).sort();
if(dates.length<14)return;
const tail=dates.slice(-14);
for(let i=1;i<tail.length;i++){
const a=new Date(tail[i-1]+'T00:00:00Z').getTime(),b=new Date(tail[i]+'T00:00:00Z').getTime();
if(b-a!==86400000)return;
}
const values=tail.map(d=>Number(s.map[d]));
const isSnapshot=/(followers?|subscribers?|members?_count|account_total|total_followers)/i.test(s.metric);
const before=isSnapshot?values[0]:values.slice(0,7).reduce((a,b)=>a+b,0)/7;
const after=isSnapshot?values[13]:values.slice(7,14).reduce((a,b)=>a+b,0)/7;
const change=before===0?null:((after/before)-1)*100;
out.push({platform:s.platform,metric:s.metric,before,after,change,isSnapshot,start:tail[0],split:tail[6],end:tail[13]});
});
return out;
}

function parseCsv(text){const out=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"'){quoted=false}else field+=c}else{if(c==='"'&&field===''){quoted=true}else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);out.push(row);row=[];field=''}else if(c!=='\r'){field+=c}}}if(quoted)throw new Error('CSV has an unclosed quoted field.');if(field!==''||row.length){row.push(field);out.push(row)}return out.filter(r=>r.some(c=>String(c).trim()!==''))}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function downloadReport(){const rs=projectRows();const payload={reportType:'AJAYNXT Social Hub project report',project:{id:currentProjectId,name:currentProject().name,accountUrl:'https://business.facebook.com/',setupUrl:'https://developers.facebook.com/docs/whatsapp/'},generatedAt:new Date().toISOString(),verification:'Values are imported user-provided records and are not independently verified against source platforms.',recordCount:rs.length,latestDataDate:latestDate(rs)||null,records:rs,forecastEligibility:listForecastSeries(rs).map(s=>({platform:s.platform,metric:s.metric,eligible:true,method:'Linear trend over latest 28 consecutive daily observations; 7-day point estimate.'})),limitations:['No live platform OAuth/API connections are active in this MVP.','Forecasts are estimates, not guarantees.','Missing dates are not interpreted as zero.']};download('ajnxt-'+currentProjectId+'-report.json',JSON.stringify(payload,null,2),'application/json')}
async function processCsv(file){try{const text=await file.text();const raw=parseCsv(text);if(raw.length<2)throw new Error('CSV has a header but no records.');const head=raw[0].map(h=>h.trim().toLowerCase());const req=['date','project','platform','metric','value'];const missing=req.filter(h=>!head.includes(h));if(missing.length)throw new Error('Missing required columns: '+missing.join(', ')+'. Download the empty template for the expected schema.');const ix={};head.forEach((h,i)=>ix[h]=i);const candidate=[];const seen=new Set();const projectByName={};projects.forEach(p=>projectByName[p.name.trim().toLowerCase()]=p);
for(let i=1;i<raw.length;i++){const row=raw[i];if(row.length!==head.length)throw new Error('Row '+(i+1)+' has '+row.length+' cells; expected '+head.length+'.');const date=(row[ix.date]||'').trim(),pname=(row[ix.project]||'').trim(),platform=(row[ix.platform]||'').trim(),metric=(row[ix.metric]||'').trim().toLowerCase().replace(/\s+/g,'_'),valueS=(row[ix.value]||'').trim(),source=ix.source!=null?(row[ix.source]||'').trim():'CSV import';if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T00:00:00Z').getTime())||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date)throw new Error('Invalid date on row '+(i+1)+'. Use YYYY-MM-DD.');if(!pname||!projectByName[pname.toLowerCase()])throw new Error('Unknown project on row '+(i+1)+': '+pname+'. Create that project first or match its name exactly.');if(!platform||!metric)throw new Error('Platform or metric is blank on row '+(i+1)+'.');if(valueS===''||!Number.isFinite(Number(valueS))||Number(valueS)<0)throw new Error('Value must be a non-negative number on row '+(i+1)+'.');const key=projectByName[pname.toLowerCase()].id+'|||'+date+'|||'+platform.toLowerCase()+'|||'+metric;if(seen.has(key))throw new Error('Duplicate date/project/platform/metric on row '+(i+1)+'. Resolve duplicates at source before importing.');seen.add(key);candidate.push({id:'row-'+Date.now()+'-'+i,projectId:projectByName[pname.toLowerCase()].id,projectName:projectByName[pname.toLowerCase()].name,date,platform,metric,value:Number(valueS),source:source||'CSV import',importedAt:new Date().toISOString()})}
const old=rows;const oldSeen=new Set(rows.map(r=>r.projectId+'|||'+r.date+'|||'+r.platform.toLowerCase()+'|||'+r.metric));for(const c of candidate)if(oldSeen.has(c.projectId+'|||'+c.date+'|||'+c.platform.toLowerCase()+'|||'+c.metric))throw new Error('One or more records already exist in stored data. Duplicate rows are not overwritten automatically; export/clear the project import or remove duplicates in the source file.');if(cloudMode&&window.ajnxtCloud){const projectIds=Array.from(new Set(candidate.map(c=>c.projectId)));if(projectIds.length!==1)throw new Error('For a cloud import, upload one project per CSV file.');if(candidate.length>80)throw new Error('Cloud imports are limited to 80 observations per file on the free database tier; split this CSV into smaller date ranges.');const projectId=projectIds[0];const payload={organizationId:cloudWorkspace.id,records:candidate.map(c=>({date:c.date,platform:c.platform,metric:c.metric,value:c.value,source:c.source||'CSV import'}))};const result=await window.ajnxtCloud.request('/api/projects/'+encodeURIComponent(projectId)+'/imports',{method:'POST',body:payload});rows=rows.concat(candidate.map(c=>({...c,sourceVerified:false})));save();closeModal();render();toast('Uploaded '+result.imported+' record(s) to the secured backend. Source has not been independently verified.');return}rows=rows.concat(candidate);save();closeModal();render();toast('Imported '+candidate.length+' real CSV record(s). Source data is user-provided and not independently verified.')}catch(e){toast(e.message||'CSV import failed.');}}

async function apiRequest(path, options){
  options=options||{};
  if(!auth||!auth.currentUser)throw new Error('Sign in to use the secure project backend.');
  const token=await auth.currentUser.getIdToken();
  const headers={'Authorization':'Bearer '+token};
  if(options.body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch(path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body),cache:'no-store'});
  let result={};try{result=await response.json()}catch(e){}
  if(!response.ok)throw new Error(result.message||('Request failed with HTTP '+response.status));
  return result;
}
async function loadProjectMetrics(projectId){
  if(!workspace)throw new Error('Workspace is not loaded yet.');
  return apiRequest('/api/projects/'+encodeURIComponent(projectId)+'/metrics?organizationId='+encodeURIComponent(workspace.id)+'&limit=2000');
}
async function loadProjectDrafts(projectId){
  if(!workspace)throw new Error('Workspace is not loaded yet.');
  return apiRequest('/api/projects/'+encodeURIComponent(projectId)+'/drafts?organizationId='+encodeURIComponent(workspace.id));
}
async function refreshCloud(){
  if(!currentUser)return;
  cloudReady=false;status('Syncing workspace…');
  try{
    const response=await apiRequest('/api/workspaces');
    let activeWorkspace=(response.workspaces||[])[0];
    if(!activeWorkspace){const created=await apiRequest('/api/workspaces',{method:'POST',body:{name:'AJAYNXT Workspace'}});activeWorkspace=created.workspace;}
    workspace=activeWorkspace;
    const projectResponse=await apiRequest('/api/projects?organizationId='+encodeURIComponent(workspace.id));
    const projects=projectResponse.projects||[];
    if(!projects.length)throw new Error('Workspace has no active projects. Create one after checking project permissions.');
    const activeProject=projects.find(p=>p.id==='diamond-restaurant')||projects[0];
    const metrics=await loadProjectMetrics(activeProject.id);
    cloudReady=true;
    status('Cloud · '+String(workspace.name||'Workspace').slice(0,20));
    window.dispatchEvent(new CustomEvent('ajnxt-cloud-ready',{detail:{user:{uid:currentUser.uid,email:currentUser.email||null},workspace,projects,projectId:activeProject.id,metrics}}));
  }catch(error){
    status('Retry backend sync');
    window.dispatchEvent(new CustomEvent('ajnxt-cloud-error',{detail:{message:'Firebase sign-in succeeded, but backend sync is not ready: '+(error.message||'Unknown error')+'. Check Firebase/Vercel server environment setup.'}}));
  }
}
window.ajnxtCloud={request:apiRequest,loadProjectMetrics:loadProjectMetrics,loadProjectDrafts:loadProjectDrafts,refresh:refreshCloud,get workspace(){return workspace},get currentUser(){return currentUser},get ready(){return cloudReady}};
if(authButton){authButton.addEventListener('click',async()=>{
  try{
    if(!auth){showMessage(initError+' Configure Firebase Web settings and server credentials before signing in.');return;}
    if(currentUser&&cloudReady){await signOutFn(auth);return;}
    if(currentUser){await refreshCloud();return;}
    await signInWithPopupFn(auth,googleProvider);
  }catch(error){showMessage('Account action failed: '+(error.message||'Unknown error'));}
});}
(async function initializeAuth(){
  try{
    const response=await fetch('/api/config',{cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.configured){initError=data.message||'Firebase Web configuration is not set for this deployment.';status('Backend setup needed');return;}
    const sdk='https://www.gstatic.com/firebasejs/12.19.0/';
    const appSdk=await import(sdk+'firebase-app.js');
    const authSdk=await import(sdk+'firebase-auth.js');
    const app=appSdk.initializeApp(data.config);
    auth=authSdk.getAuth(app);
    googleProvider=new authSdk.GoogleAuthProvider();
    signInWithPopupFn=authSdk.signInWithPopup;
    signOutFn=authSdk.signOut;
    onAuthStateChangedFn=authSdk.onAuthStateChanged;
    status('Sign in to sync');
    onAuthStateChangedFn(auth,async user=>{
      currentUser=user||null;
      if(!user){workspace=null;cloudReady=false;status('Sign in to sync');window.dispatchEvent(new CustomEvent('ajnxt-cloud-signed-out'));return;}
      await refreshCloud();
    });
  }catch(error){initError='Firebase client setup could not initialize. Verify the web config, authorized domain and network access.';status('Backend setup needed');}
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
